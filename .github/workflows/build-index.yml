name: Build Vault Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 자동생성 산출물(META/INDEX/CORPUS)만 바뀐 push는 무시 → 인덱서 자기 커밋 루프 방지.
    # 그 외 모든 변경(노트 .md·스크립트·설정 등)은 빌드한다. [skip ci]와 이중 안전장치.
    # 글롭 패턴: 신규 DB(TRAVEL 등)가 추가돼도 목록 갱신 불필요. (*는 /를 넘지 않음 = 루트 한정)
    paths-ignore:
      - '*_META.md'
      - '*_INDEX.json'
      - 'INDEX.md'
      - 'SEARCH_CORPUS.json'

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  lint:
    # 오염 재발 방지 게이트 (P0-D / T0.2) — 개인값 필드 승인 여부·링크 도메인 allowlist·
    # 직군 어휘 denylist를 검사한다. 이 잡이 실패하면 아래 build 잡이 실행되지 않아
    # 인덱스 재생성·커밋·push 전체가 막힌다(= 오염된 노트가 push되어도 산출물엔 안 실린다는
    # 안전장치가 아니라, 애초에 커밋 자체를 막는 선행 게이트).
    #
    # CRITICAL-1: 이 워크플로 전체(.github/workflows/)는 템플릿 generate로 고객 repo에도 그대로
    # 복제된다. 고객 vault는 실데이터라 승인 목록이 있을 리 없어 rule1이 항상 FAIL하고, 그러면
    # 고객의 index 빌드가 영구히 막힌다 — 그래서 lint는 원본 템플릿 repo에서만 돈다.
    if: github.repository == 'kezilacworks/secondbrain-vault-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: .build
        run: npm install --no-audit --no-fund

      - name: Run template lint
        working-directory: .build
        run: node scripts/lint-template.mjs

  build:
    needs: lint
    # lint는 고객 repo에서 항상 skip된다(위 if 참고) — 단순 `needs: lint`만 쓰면 GitHub Actions가
    # "의존 잡이 skip되면 이 잡도 skip"을 기본값으로 적용해 고객의 index 빌드가 아예 안 도는
    # 회귀가 생긴다. 그래서 always()로 기본 게이팅을 무시하고, lint 결과가 success(템플릿 repo,
    # 통과) 또는 skipped(고객 repo)일 때만 진행하도록 명시한다 — lint가 실제로 failure인
    # 경우(템플릿 repo에서 진짜 오염 커밋)에만 build를 막는다.
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 빌드 도구는 .build/ 안에 있다(package.json·node_modules·scripts). npm은 거기서 실행.
      # 스크립트의 VAULT_ROOT는 파일 위치 기준이라 산출물(META/INDEX/CORPUS)은 루트로 간다.
      - name: Install dependencies
        working-directory: .build
        run: npm install --no-audit --no-fund

      - name: Build index files
        working-directory: .build
        run: npm run build-index

      - name: Build search corpus
        working-directory: .build
        run: npm run build-search-corpus

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 글롭 add: META_CONFIGS에 DB가 추가되면 산출물도 자동 포함 (하드코딩 목록 금지 원칙)
          git add -- *_META.md *_INDEX.json SEARCH_CORPUS.json
          if git diff --staged --quiet; then
            echo "No index changes to commit"
            exit 0
          fi
          git commit -m "chore: rebuild vault index + search corpus [skip ci]"
          # 사용자 push(obsidian-git 3분 주기)와 경쟁할 수 있으므로 rebase 후 push를 3회 재시도
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 실패 ($i/3) — rebase 후 재시도"
            git pull --rebase --autostash || exit 1
          done
          echo "::error::인덱스 커밋 push가 3회 모두 실패했습니다"
          exit 1
